name: barbuzz
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  table_calendar: ^3.0.0
  cupertino_icons: ^1.0.8
  provider: ^6.0.0
  image_picker: ^0.8.5+3
  http: ^1.2.2
  flutter_secure_storage: ^8.0.0
  intl: ^0.19.0
  flutter_multiselect: ^1.0.0
  firebase_core: ^3.7.0 # Ensure this is the latest version
  firebase_auth: ^5.3.0 # Ensure this is the latest version
  cloud_firestore: ^5.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.2.14

flutter:
  uses-material-design: true

  assets:
    - assets/logos/BarBee.png
    - assets/logos/BarBuzz.png
    - assets/logos/arepas.jpg
    - assets/logos/boardtown.jpg

flutter_native_splash:
  color: "#0063dd"
  image: assets/logo.png # Make sure this logo.png exists in the assets folder
  android: true
  ios: true
